<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Map Web App</title>
  
  <!-- Leaflet CSS for the Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Link to your styles.css -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Fullscreen Map Container -->
  <div id="map"></div>

  <!-- Draggable/Collapsible Panel -->
  <div class="panel expanded">
    
    <!-- Clickable Header Area for Mobile Toggle -->
    <div class="panel-header" id="panel-toggle">
      <div class="brand">
        <!-- Placeholder image -->
        <img src="https://via.placeholder.com/42/8b5cf6/ffffff?text=M" alt="Brand Logo">
        <div>
          <h1>GeoApp</h1>
          <span>Explore your world</span>
        </div>
      </div>
    </div>

    <!-- Search Section -->
    <div class="search-group">
      <input type="text" placeholder="Search locations...">
      <select>
        <option value="all">All Categories</option>
        <option value="food">Food & Drink</option>
        <option value="retail">Retail</option>
        <option value="services">Services</option>
      </select>
    </div>

    <!-- POI Quick Filters -->
    <div class="section-title">Points of Interest</div>
    <div class="poi-grid">
      <div class="poi-chip active">Coffee Shops</div>
      <div class="poi-chip">Restaurants</div>
      <div class="poi-chip">Parks</div>
      <div class="poi-chip">Transit</div>
    </div>

    <!-- Summary Stats -->
    <div class="section-title">Area Overview</div>
    <div class="summary-grid">
      <div class="summary-card active">
        <div class="summary-label">Total Places</div>
        <div class="summary-value">1,248</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Avg Rating</div>
        <div class="summary-value">4.6</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="button-row">
      <button class="secondary-btn">Clear</button>
      <button class="primary-btn">Apply Filters</button>
    </div>

    <!-- Loading Indicator (Hidden by default) -->
    <div class="loading hidden">Loading data...</div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- App Logic -->
  <script>
    // 1. Initialize Map (Basic Leaflet Setup)
    const map = L.map('map', {
      zoomControl: true // Zoom controls are moved down by your CSS
    }).setView([32.8407, -83.6324], 13); // Centered on Macon, GA as an example

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // 2. Mobile Panel Toggle Logic
    document.addEventListener('DOMContentLoaded', () => {
      const panel = document.querySelector('.panel');
      const toggleArea = document.getElementById('panel-toggle');

      toggleArea.addEventListener('click', () => {
        // Only apply toggle logic on mobile view (768px or less)
        if (window.innerWidth <= 768) {
          panel.classList.toggle('expanded');
          
          // Scroll back to the top of the panel when collapsing
          if (!panel.classList.contains('expanded')) {
            panel.scrollTop = 0;
          }
        }
      });

      // Simple active state toggle for UI demonstration
      const chips = document.querySelectorAll('.poi-chip, .summary-card');
      chips.forEach(chip => {
        chip.addEventListener('click', function() {
          this.classList.toggle('active');
        });
      });
    });
  </script>
</body>
</html>
