<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RadiusScout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>RadiusScout</h1>
      <p>Find community infrastructure and amenities around any address.</p>
    </header>

    <section id="controls">
      <div class="form-row">
        <label for="addressInput">Address</label>
        <input
          type="text"
          id="addressInput"
          placeholder="Enter an address (e.g., 123 Main St, Macon, GA)"
        />
      </div>

      <div class="form-row">
        <label for="radiusSelect">Radius</label>
        <select id="radiusSelect">
          <option value="152">500 ft</option>
          <option value="305">1000 ft</option>
          <option value="1609">1 mile</option>
          <option value="3219">2 miles</option>
        </select>
      </div>

      <div class="form-row checkbox-row">
        <span>POI Types:</span>
        <div class="checkbox-grid">
          <label><input type="checkbox" id="poiWorship" checked /> Worship</label>
          <label><input type="checkbox" id="poiSchools" checked /> Schools</label>
          <label><input type="checkbox" id="poiColleges" checked /> Colleges</label>
          <label><input type="checkbox" id="poiKindergarten" checked /> Kindergartens</label>
          <label><input type="checkbox" id="poiDaycare" checked /> Daycares</label>
          <label><input type="checkbox" id="poiLibraries" checked /> Libraries</label>
          <label><input type="checkbox" id="poiParks" checked /> Parks</label>
          <label><input type="checkbox" id="poiPlaygrounds" checked /> Playgrounds</label>
          <label><input type="checkbox" id="poiPools" checked /> Pools</label>
        </div>
      </div>

      <div class="form-row button-group">
        <button id="searchBtn">Search Area</button>
        <button id="clearBtn" type="button">Clear Map</button>
      </div>

      <div id="summaryPopup" class="summary hidden">
        <h3>POI Summary</h3>
        <div class="poi-summary-grid">
          <div class="summary-item">Worship: <span id="countWorship">0</span></div>
          <div class="summary-item">Schools: <span id="countSchools">0</span></div>
          <div class="summary-item">Colleges: <span id="countColleges">0</span></div>
          <div class="summary-item">Kindergartens: <span id="countKindergarten">0</span></div>
          <div class="summary-item">Daycares: <span id="countDaycare">
