<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Radius Scout</title>

  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/site.webmanifest">
  
  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div id="map"></div>

<!-- Floating Glass Panel -->
<div class="panel">

  <div class="brand">
    <img src="assets/logo.png" alt="Logo">
    <div>
      <h1>Radius Scout</h1>
      <span>Location Intelligence</span>
    </div>
  </div>

  <div id="summary-toggle" class="summary-header">
    <h3 style="margin: 0; font-size: 14px;">Search Parameters</h3>
    <span id="summary-chevron" style="transition: transform 0.3s ease;">▼</span>
  </div>

  <div id="summary-content" class="summary-content">

    <div class="search-group">
      <div class="search-input-row">
        <div class="autocomplete-wrapper">
          <input id="addressInput" type="text" placeholder="Enter address" autocomplete="off">
          <div id="addressSuggestions" class="suggestions"></div>
        </div>
        <button id="locationBtn" class="location-icon-btn" title="Use My Location" type="button">📍</button>
      </div>

      <select id="radiusSelect">
        <option value="152">500 ft</option>
        <option value="305">1000 ft</option>
        <option value="805">1/2 mile</option>
        <option value="1609" selected>1 mile</option>
      </select>
    </div>
    
    <div id="matchedAddress" class="matched-address">
      Enter an address and click Search
    </div>
    
    <div class="section-title">Points of Interest</div>
    
    <div id="poiContainer"></div>

    <div class="button-row">
      <button id="searchBtn" class="primary-btn">Search Area</button>
      <button id="clearBtn" class="secondary-btn">Clear</button>
      <button id="exportPdfBtn" class="secondary-btn" style="background-color: #ef4444; color: white; border: none; display: none;">📄 PDF</button>
    </div>
    
    <div class="section-title summary-title" style="margin-top: 15px;">
      Summary
    </div>
    <div id="summaryGrid" class="summary-grid"></div>

  </div> <div id="property-list" class="property-list"></div>

  <div class="footer">
    <div class="footer-title">
      © 2026 Radius Scout
    </div>
    <div class="footer-text">
      Data provided by OpenStreetMap contributors.
    </div>
    <div class="footer-text">
      Results should be independently verified.
    </div>
    <div class="footer-version">
      Version 1.0.0 • Build 2026.06
    </div>
  </div>

</div>

<!-- Floating Mobile Toggle Button MUST be outside the panel! -->
<button id="mobile-view-toggle" class="mobile-toggle-btn">🗺️ Map View</button>

<!-- PDF Export Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- App -->
<script type="module" src="js/main.js"></script>  

</body>
</html>
