<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radius Scout</title>

<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div id="map"></div>

<div class="panel">
  <div class="brand">
    <img src="assets/logo.png">
    <div>
      <h2>Radius Scout</h2>
      <span>Location Intelligence</span>
    </div>
  </div>

  <input id="addressInput" placeholder="Enter address">

  <select id="radiusSelect">
    <option value="152">500 ft</option>
    <option value="305">1000 ft</option>
    <option value="805">1/2 mile</option>
    <option value="1609">1 mile</option>
  </select>

  <div id="poiChips" class="grid"></div>

  <button class="primary" id="searchBtn">Search</button>
  <button class="secondary" id="clearBtn">Clear</button>

  <div id="summary" class="summary"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>

</body>
</html>
